<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>실시간 상태 모니터링</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .modern-font {
            font-family: 'Outfit', sans-serif;
        }
        
        :root {
            --bg-main: #0F172A;
            --bg-card: rgba(30, 41, 59, 0.75);
            --border-card: rgba(51, 65, 85, 0.8);
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --accent-warm: #38BDF8;
            --accent-sub: rgba(15, 23, 42, 0.5);
        }
        [data-theme="light"] {
            --bg-main: #F8FAFC;
            --bg-card: rgba(255, 255, 255, 0.85);
            --border-card: rgba(226, 232, 240, 0.9);
            --text-main: #0F172A;
            --text-sub: #64748B;
            --accent-warm: #0284C7;
            --accent-sub: rgba(241, 245, 249, 0.9);
        }

        /* 글래스모피즘 (고정형 디자인으로 안정감 부여) */
        .glass-card {
            background-color: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-card);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .glass-header {
            background-color: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-card);
        }

        /* 언어 선택 및 버튼 UI 스타일 통일 */
        .ui-control-box {
            background-color: var(--accent-sub);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .ui-control-box:hover {
            border-color: var(--accent-warm);
        }
    </style>
</head>
<body style="background-color: var(--bg-main); color: var(--text-main);" class="min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-header">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </div>
                <div>
                    <span class="modern-font text-lg font-bold tracking-tight">상태 모니터링</span>
                    <span class="block text-[10px] tracking-widest font-semibold uppercase opacity-60" data-i18n="headerSub">실시간 현황판</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- 통일된 UI 스타일이 적용된 4개국어 선택 드롭다운 -->
                <div class="relative">
                    <select id="langSelect" class="ui-control-box text-xs rounded-xl px-4 py-2.5 outline-none cursor-pointer font-medium appearance-none pr-9 shadow-sm">
                        <option value="ko" style="background: var(--bg-main); color: var(--text-main);">🇰🇷 한국어</option>
                        <option value="en" style="background: var(--bg-main); color: var(--text-main);">🇺🇸 English</option>
                        <option value="ja" style="background: var(--bg-main); color: var(--text-main);">🇯🇵 日本語</option>
                        <option value="zh" style="background: var(--bg-main); color: var(--text-main);">🇨🇳 中文</option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none opacity-50 text-[10px]">
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <!-- 테마 토글 버튼 -->
                <button id="themeToggle" class="ui-control-box w-10 h-10 rounded-xl flex items-center justify-center cursor-pointer">
                    <i id="themeIcon" class="fa-solid fa-moon text-sky-400 text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="max-w-6xl mx-auto px-6 py-8 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8 items-start w-full">
        
        <!-- Left: Webcam -->
        <div class="lg:col-span-7 flex flex-col space-y-6">
            <div class="glass-card rounded-3xl p-6">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="modern-font text-sm font-bold flex items-center space-x-2 tracking-wide">
                        <i class="fa-solid fa-video text-sky-400"></i>
                        <span data-i18n="feedTitle">실시간 카메라 영상</span>
                    </h2>
                    
                    <!-- 카메라 ON/OFF 버튼 -->
                    <button id="camToggleBtn" onclick="toggleCamera()" class="bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-600 hover:to-indigo-600 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-md text-xs flex items-center space-x-2 active:scale-95 cursor-pointer">
                        <i id="camBtnIcon" class="fa-solid fa-play"></i>
                        <span id="camBtnText" data-i18n="startBtn">카메라 시작하기</span>
                    </button>
                </div>

                <div class="relative aspect-video w-full bg-black/20 rounded-2xl overflow-hidden border border-white/5 flex items-center justify-center shadow-inner">
                    <div id="webcam-container" class="w-full h-full flex items-center justify-center">
                        <div id="placeholderText" class="text-center p-6 opacity-50 flex flex-col items-center space-y-3">
                            <i class="fa-solid fa-camera text-4xl text-sky-400"></i>
                            <p class="text-xs font-medium tracking-wide" data-i18n="placeholder">버튼을 눌러 카메라를 연결하세요.</p>
                        </div>
                    </div>
                    <div class="absolute top-4 left-4 backdrop-blur-md border px-3 py-1.5 rounded-full text-[11px] font-medium flex items-center space-x-2 shadow-sm" style="background-color: var(--bg-card); border-color: var(--border-card);">
                        <span class="w-2 h-2 rounded-full bg-amber-400" id="statusDot"></span>
                        <span id="statusText" data-i18n="statusStandby">대기 중</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Status Display -->
        <div class="lg:col-span-5 flex flex-col space-y-6">
            <div class="glass-card rounded-3xl p-6 flex flex-col items-center text-center">
                <h2 class="modern-font text-sm font-bold flex items-center space-x-2 mb-6 w-full justify-start tracking-wide">
                    <i class="fa-solid fa-chart-pie text-sky-400"></i>
                    <span data-i18n="analyticsTitle">현재 인식 상태</span>
                </h2>

                <div class="relative w-48 h-48 my-4 flex items-center justify-center">
                    <!-- 고정형 테두리 (불필요한 애니메이션 제거) -->
                    <div class="absolute inset-0 rounded-full border-4 border-dashed border-sky-400/20"></div>
                    <div class="absolute inset-3 rounded-full flex flex-col items-center justify-center p-4 shadow-inner" style="background-color: var(--accent-sub);">
                        <span class="text-[11px] font-semibold uppercase opacity-60 mb-1 tracking-wider" data-i18n="currentState">현재 상태</span>
                        <span id="coreMainClassName" class="modern-font text-2xl font-bold text-sky-400 truncate max-w-[150px]">-</span>
                    </div>
                </div>

                <div class="w-full mt-4 pt-4 border-t text-xs text-left opacity-60 leading-relaxed" style="border-color: var(--border-card);" data-i18n="guideText">
                    * 카메라 화면을 분석하여 해당하는 상태(예: 적음, 많음)를 표시합니다.
                </div>
            </div>

            <!-- 하단 상태 목록 칩 -->
            <div id="label-container" class="glass-card rounded-2xl p-4 grid grid-cols-2 gap-3">
                <div class="col-span-2 text-center py-4 text-xs opacity-50 font-medium" data-i18n="waitingModel">
                    모델 로딩 대기 중...
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t py-6 text-center text-xs opacity-50" style="border-color: var(--border-card);">
        <p>&copy; 2026 AI MONITORING SYSTEM. ALL RIGHTS RESERVED.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const translations = {
            ko: {
                headerSub: "실시간 현황판",
                feedTitle: "실시간 카메라 영상",
                startBtn: "카메라 시작하기",
                stopBtn: "카메라 끄기",
                placeholder: "버튼을 눌러 카메라를 연결하세요.",
                statusStandby: "대기 중",
                statusActive: "분석 작동 중",
                analyticsTitle: "현재 인식 상태",
                currentState: "현재 상태",
                guideText: "* 카메라 화면을 분석하여 해당하는 상태(예: 적음, 많음)를 표시합니다.",
                waitingModel: "모델 로딩 대기 중...",
                errorMsg: "카메라 권한을 확인하거나 장치를 연결할 수 없습니다."
            },
            en: {
                headerSub: "Live Dashboard",
                feedTitle: "Live Camera Stream",
                startBtn: "Start Camera",
                stopBtn: "Stop Camera",
                placeholder: "Click to connect camera.",
                statusStandby: "Standby",
                statusActive: "Monitoring",
                analyticsTitle: "Current Status",
                currentState: "Status",
                guideText: "* Displays the detected state (e.g., low, high) in real time.",
                waitingModel: "Waiting for model...",
                errorMsg: "Could not access camera or load model."
            },
            ja: {
                headerSub: "リアルタイム状況盤",
                feedTitle: "ライブカメラ映像",
                startBtn: "カメラ開始",
                stopBtn: "カメラ停止",
                placeholder: "ボタンを押してカメラを接続してください。",
                statusStandby: "待機中",
                statusActive: "分析中",
                analyticsTitle: "現在の認識状態",
                currentState: "現在の状態",
                guideText: "* カメラ映像を分析し、該当する状態（少ない、多いなど）を表示します。",
                waitingModel: "モデルの読み込み待ち...",
                errorMsg: "カメラへのアクセスまたはモデルの読み込みに失敗しました。"
            },
            zh: {
                headerSub: "实时状态面板",
                feedTitle: "实时相机画面",
                startBtn: "开启相机",
                stopBtn: "关闭相机",
                placeholder: "点击按钮连接相机。",
                statusStandby: "待机中",
                statusActive: "监控中",
                analyticsTitle: "当前识别状态",
                currentState: "当前状态",
                guideText: "* 分析相机画面并显示对应状态（例如：少、多）。",
                waitingModel: "等待模型加载中...",
                errorMsg: "无法访问相机或加载模型。"
            }
        };

        let currentLang = 'ko';
        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            updateTexts();
        });

        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
            
            // 카메라 상태에 따라 버튼 및 배지 텍스트 실시간 동기화
            if (isCameraOn) {
                document.getElementById('camBtnText').innerText = translations[currentLang].stopBtn;
                document.getElementById('statusText').innerText = translations[currentLang].statusActive;
            } else {
                document.getElementById('camBtnText').innerText = translations[currentLang].startBtn;
                document.getElementById('statusText').innerText = translations[currentLang].statusStandby;
                
                // 플레이스홀더 문구 업데이트
                const placeholderP = document.querySelector('#placeholderText p');
                if (placeholderP) {
                    placeholderP.innerText = translations[currentLang].placeholder;
                }
                
                // 모델 대기 문구 업데이트
                const waitingEl = document.querySelector('#label-container div');
                if (waitingEl && !isModelLoaded) {
                    waitingEl.innerText = translations[currentLang].waitingModel;
                }
            }
        }

        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                htmlElement.setAttribute('data-theme', 'dark');
                themeIcon.className = "fa-solid fa-sun text-amber-400 text-sm";
            } else {
                htmlElement.setAttribute('data-theme', 'light');
                themeIcon.className = "fa-solid fa-moon text-sky-400 text-sm";
            }
        });

        const URL = "https://teachablemachine.withgoogle.com/models/QUqC192tV/";
        const BASE_URL = URL.endsWith('/') ? URL : URL + '/';

        let model, webcam, maxPredictions;
        let isModelLoaded = false;
        let isCameraOn = false;
        let animationId = null;

        async function toggleCamera() {
            if (!isCameraOn) {
                await startCamera();
            } else {
                stopCamera();
            }
        }

        async function startCamera() {
            const camBtnText = document.getElementById('camBtnText');
            const camBtnIcon = document.getElementById('camBtnIcon');
            const camToggleBtn = document.getElementById('camToggleBtn');
            
            camToggleBtn.disabled = true;
            camBtnText.innerText = "...";

            try {
                if (!isModelLoaded) {
                    model = await tmImage.load(BASE_URL + "model.json", BASE_URL + "metadata.json");
                    maxPredictions = model.getTotalClasses();
                    isModelLoaded = true;
                }

                // 버그 수정: 재시작 시 스트림 충돌을 방지하기 위해 웹캠 인스턴스 정비 후 셋업
                if (!webcam) {
                    webcam = new tmImage.Webcam(420, 315, true);
                    await webcam.setup();
                } else {
                    await webcam.setup();
                }
                
                await webcam.play();
                
                const webcamContainer = document.getElementById("webcam-container");
                webcamContainer.innerHTML = "";
                webcamContainer.appendChild(webcam.canvas);

                isCameraOn = true;
                document.getElementById('statusDot').className = "w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.9)]";
                document.getElementById('statusText').innerText = translations[currentLang].statusActive;
                
                camBtnIcon.className = "fa-solid fa-stop";
                camBtnText.innerText = translations[currentLang].stopBtn;
                camToggleBtn.disabled = false;

                window.requestAnimationFrame(loop);

            } catch (error) {
                console.error("Camera error:", error);
                alert(translations[currentLang].errorMsg);
                camToggleBtn.disabled = false;
                camBtnIcon.className = "fa-solid fa-play";
                camBtnText.innerText = translations[currentLang].startBtn;
            }
        }

        function stopCamera() {
            if (webcam) {
                webcam.stop();
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            isCameraOn = false;

            document.getElementById('statusDot').className = "w-2 h-2 rounded-full bg-amber-400";
            document.getElementById('statusText').innerText = translations[currentLang].statusStandby;

            document.getElementById('camBtnIcon').className = "fa-solid fa-play";
            document.getElementById('camBtnText').innerText = translations[currentLang].startBtn;

            document.getElementById("webcam-container").innerHTML = `
                <div id="placeholderText" class="text-center p-6 opacity-50 flex flex-col items-center space-y-3">
                    <i class="fa-solid fa-camera text-4xl text-sky-400"></i>
                    <p class="text-xs">${translations[currentLang].placeholder}</p>
                </div>
            `;

            document.getElementById('coreMainClassName').innerText = "-";
            document.getElementById('label-container').innerHTML = `
                <div class="col-span-2 text-center py-4 text-xs opacity-50 font-medium">
                    ${translations[currentLang].waitingModel}
                </div>
            `;
        }

        async function loop() {
            if (!isCameraOn) return;
            webcam.update();
            await predict();
            animationId = window.requestAnimationFrame(loop);
        }

        async function predict() {
            if (!isCameraOn) return;
            const prediction = await model.predict(webcam.canvas);
            
            let topPrediction = prediction[0];
            for (let i = 1; i < maxPredictions; i++) {
                if (prediction[i].probability > topPrediction.probability) {
                    topPrediction = prediction[i];
                }
            }

            document.getElementById('coreMainClassName').innerText = topPrediction.className;

            let subHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                const isActive = prediction[i].className === topPrediction.className;
                const activeStyle = isActive ? "border-sky-400 bg-sky-400/10 font-bold text-sky-400 shadow-sm" : "opacity-60";
                
                subHTML += `
                    <div class="p-2.5 rounded-xl border flex items-center justify-center text-xs transition duration-200 ${activeStyle}" style="border-color: var(--border-card);">
                        <span class="truncate">${prediction[i].className}</span>
                    </div>
                `;
            }
            document.getElementById('label-container').innerHTML = subHTML;
        }
    </script>
</body>
</html>
